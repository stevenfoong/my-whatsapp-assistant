name: Test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the zip to a tagged release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium for end-to-end tests
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end tests (real Chromium + extension, mock WhatsApp and Ollama)
        run: |
          export CHROMIUM_PATH="$(node -e "import('playwright-core').then(m => console.log(m.chromium.executablePath()))")"
          npm run test:e2e

      - name: Package extension
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          (cd extension && zip -qr "../whatsapp-reply-assistant-$VERSION.zip" .)
          echo "ZIP=whatsapp-reply-assistant-$VERSION.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-reply-assistant
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
